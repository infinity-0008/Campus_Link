services:
  - type: web
    name: campuslink-api
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm install && npm run download:model --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_MAX_POOL_SIZE
        value: 5
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_RESUME_MB
        value: 5
      - key: AI_ENABLED
        value: true
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: ""
      - key: LLM_API_KEY
        value: ""
      - key: LLM_TIMEOUT_MS
        value: 15000
      - key: LLM_MAX_CONCURRENCY
        value: 2
      - key: EMBEDDINGS_ENABLED
        value: true
      - key: EMBEDDINGS_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: EMBEDDINGS_THREADS
        value: 1
      - key: PARSE_THREADS
        value: 2
      - key: SKILL_MATCH_THRESHOLD
        value: 0.55
      - key: LOG_LEVEL
        value: info
